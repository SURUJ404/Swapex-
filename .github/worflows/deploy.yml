name: Test and deploy

on:
  push:
    branches:
      - main

jobs:
  use-reusable:
    uses:
    with:
      node-version: '20'

  deploy:
    needs: use-reusable
    runs-on: ubuntu-latest

    steps:
      - uses:

      - uses:
        with:
          node-version: 20

      - run: npm install

      - name: Deploy to Vercel
        run: npx vercel --token ${{ secrets.SWAPID }} --prod --confirm

        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.SWAPID }}