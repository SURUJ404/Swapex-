[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["lib"]

solc_version = "0.8.26"
optimizer = true
optimizer_runs = 800
bytecode_hash = "none"        # keeps the pool init-code hash stable across machines
cbor_metadata = false
evm_version = "cancun"
via_ir = true                 # swap() has many locals; IR pipeline avoids "stack too deep"

# C: forge tests read the JS-generated Merkle fixture (apps/web/scripts/merkle.ts output)
fs_permissions = [{ access = "read", path = "./test/fixtures" }]

[profile.default.fuzz]
runs = 512

[profile.default.invariant]
runs = 64
depth = 30

# CI profile: identical compiler settings, harder sampling. Local runs keep the fast profile
# above; CI sets FOUNDRY_PROFILE=ci so a green build means 2x the fuzz runs and 2x both
# invariant dimensions, not 512/64/30. (forge has no --invariant-runs flag, so the only way
# to scale invariant campaigns outside foundry.toml is a profile.)
[profile.ci]
# (inherits every key from profile.default; overridden below)

[profile.ci.fuzz]
runs = 1000

[profile.ci.invariant]
runs = 128
depth = 60

