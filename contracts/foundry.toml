[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["lib"]

solc_version = "0.8.26"
optimizer = true
optimizer_runs = 800
bytecode_hash = "none"        # keeps the pool init-code hash stable across machines
cbor_metadata = false
evm_version = "cancun"
via_ir = true                 # swap() has many locals; IR pipeline avoids "stack too deep"

[profile.default.fuzz]
runs = 512

[profile.default.invariant]
runs = 64
depth = 30
