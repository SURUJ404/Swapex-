name: CI

on:
  push:
    branches: [main]
  pull_request:

# least privilege: jobs only read the repo
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
      - name: Install forge-std
        run: forge install foundry-rs/forge-std --no-git
      - run: forge build --sizes
      - run: forge test -vv
      - name: Python reference model must still agree
        run: |
          cd reference
          python3 check_refmath.py
          python3 check_pool.py
          python3 gen_vectors.py
          git diff --exit-code ../test/v3/GoldenVectors.t.sol

  slither:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
      - run: forge install foundry-rs/forge-std --no-git
      - uses: crytic/slither-action@v0.4.0
        with:
          target: src/
          fail-on: medium

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # scan the whole history, not just the last commit
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # organisation accounts need a (free) licence key: add GITLEAKS_LICENSE as a repo secret
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
          GITLEAKS_CONFIG: .gitleaks.toml
